# Tema di partenza: la tavolozza "campionato" (verde, chiara).
#
# Streamlit legge questo file **all'avvio e mai piu'**: serve perche' i widget
# nativi siano gia' del colore giusto al primo disegno, senza il lampo bianco
# che si vedrebbe aspettando il CSS. Il passaggio al blu delle finali di
# Champions avviene a runtime riscrivendo le variabili --st-* (app/theme.py).
#
# I valori qui sotto sono il tema VERDE di src/football_analytics/tema.py.
# Sono l'unica duplicazione di colori del progetto, ed e' inevitabile: un file
# TOML letto prima che Python parta non puo' importare niente. Un test
# verifica che le due copie non divergano.

[theme]
base = "light"
primaryColor = "#15803d"
backgroundColor = "#f6f8f7"
secondaryBackgroundColor = "#ffffff"
textColor = "#111827"
borderColor = "#d5dedb"
baseRadius = "9px"
font = "sans serif"

[theme.sidebar]
backgroundColor = "#ffffff"
textColor = "#111827"
primaryColor = "#15803d"

# Il menu delle pagine che Streamlit disegna da solo resta spento.
#
# **Va spento qui e non con il CSS.** Nasconderlo con una regola iniettata
# dallo script arriva troppo tardi: fra il disegno della pagina e l'esecuzione
# del codice passa un istante in cui la barra nativa e' gia' visibile, e a
# ogni cambio pagina si vedeva comparire e sparire un secondo menu con i nomi
# dei file — «Panoramica, Scheda, Squadre». Questo file Streamlit lo legge
# prima di disegnare qualunque cosa, quindi la barra non viene proprio creata.
[client]
showSidebarNavigation = false

[server]
headless = true

# NON rimettere `fileWatcherType = "none"`.
#
# C'era, con la motivazione che sorvegliare i file sprecasse memoria su
# Streamlit Cloud. Il risparmio e' irrilevante; il costo no: disattiva il
# ricaricamento automatico, quindi l'app continua a eseguire il codice
# caricato all'avvio e ogni modifica sembra non avere effetto. E' costata
# un giro intero di modifiche apparentemente ignorate.

[browser]
gatherUsageStats = false
